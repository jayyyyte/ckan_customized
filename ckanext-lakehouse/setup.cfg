# setuptools + Babel configuration only; project metadata is in pyproject.toml.

[options]
packages = find:
namespace_packages = ckanext
install_requires =
include_package_data = True

[extract_messages]
keywords = translate isPlural N_
add_comments = TRANSLATORS:
output_file = ckanext/lakehouse/i18n/ckanext-lakehouse.pot
width = 100

[init_catalog]
domain = ckanext-lakehouse
input_file = ckanext/lakehouse/i18n/ckanext-lakehouse.pot
output_dir = ckanext/lakehouse/i18n

[update_catalog]
domain = ckanext-lakehouse
input_file = ckanext/lakehouse/i18n/ckanext-lakehouse.pot
output_dir = ckanext/lakehouse/i18n
previous = true

[compile_catalog]
domain = ckanext-lakehouse
directory = ckanext/lakehouse/i18n
statistics = true
