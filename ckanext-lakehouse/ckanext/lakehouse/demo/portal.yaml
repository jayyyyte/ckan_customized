# Demo structure of the EVN data portal for `ckan lakehouse bootstrap` (local development and
# the kind rehearsal). Same organization and group names as ckanext-evntheme demo/portal.json,
# so `ckan evntheme seed-demo` puts its 12 demo datasets into these organizations.
# Every person below is fictional. For the company cluster copy this file, list the real units,
# people and OpenMetadata teams/domains (see `ckan lakehouse om check`), and keep the copy outside
# git if it holds personal e-mail addresses.
#
#   ckan -c ckan.ini lakehouse bootstrap portal.yaml --credentials ~/ckan/backup/new-users.csv
#
# Roles: organization admin | editor | member, group admin | member (docs/phase-4-content-openmetadata.md).
# `openmetadata:` tells the OpenMetadata sync which organization owns a table (owner team, or
# table FQN pattern) and which group (data domain) an OpenMetadata domain becomes.

users:
  - name: quantri-portal
    fullname: "Quản trị Cổng dữ liệu"
    email: quantri-portal@evn.example
    about: "Quản trị toàn hệ thống (sysadmin)."
    sysadmin: true
  - name: npc-quantri
    fullname: "Quản trị dữ liệu EVNNPC"
    email: npc-quantri@evn.example
    about: "Quản trị đơn vị EVNNPC: thêm/bớt thành viên, sửa mọi bộ dữ liệu của đơn vị."
  - name: npc-bientap
    fullname: "Biên tập viên EVNNPC"
    email: npc-bientap@evn.example
    about: "Biên tập viên EVNNPC: tạo và sửa bộ dữ liệu của đơn vị."
  - name: kd-bientap
    fullname: "Biên tập viên Ban Kinh doanh"
    email: kd-bientap@evn.example
    about: "Biên tập viên Ban Kinh doanh; thành viên miền Kinh doanh & DVKH."
  - name: ktsx-bientap
    fullname: "Biên tập viên Kỹ thuật – Sản xuất"
    email: ktsx-bientap@evn.example
    about: "Biên tập hai đơn vị kỹ thuật (Ban KTSX, A0)."
  - name: a0-thanhvien
    fullname: "Thành viên A0"
    email: a0-thanhvien@evn.example
    about: "Thành viên A0: đọc được dữ liệu riêng tư của đơn vị, không sửa."
  - name: mien-ktat
    fullname: "Phụ trách miền Kỹ thuật – An toàn"
    email: mien-ktat@evn.example
    about: "Quản trị nhóm (miền dữ liệu) Kỹ thuật – An toàn."
  - name: nguoidung-xem
    fullname: "Người dùng đã đăng nhập"
    email: nguoidung-xem@evn.example
    about: "Không thuộc đơn vị nào: chỉ thấy dữ liệu công khai."
  - name: om-sync
    fullname: "Đồng bộ OpenMetadata"
    email: om-sync@evn.example
    about: "Tài khoản kỹ thuật của job đồng bộ OpenMetadata (ckanext.lakehouse.om.sync_user)."

