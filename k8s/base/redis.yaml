# Redis for CKAN only: the background job queue (XLoader) and CKAN's cache.
# Not persisted — losing it on a pod restart only drops jobs still waiting in the queue;
# resubmit them with `ckan xloader submit all`. The emptyDir keeps it across container
# restarts inside the same pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckan-redis
  labels:
    app.kubernetes.io/name: ckan-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ckan-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckan-redis
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ckan-redis
  labels:
    app.kubernetes.io/name: ckan-redis
spec:
  selector:
    app.kubernetes.io/name: ckan-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
