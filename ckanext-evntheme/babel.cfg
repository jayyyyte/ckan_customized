# Babel mapping for `pybabel extract -F babel.cfg` (README, "Translations").
# The [extractors] section makes the CKAN template extractor available without
# relying on entry points (Babel looks them up through pkg_resources, which does
# not see modern editable installs).
[extractors]
ckan = ckan.lib.extract:extract_ckan

[python: **.py]
[ckan: **/templates/**.html]
