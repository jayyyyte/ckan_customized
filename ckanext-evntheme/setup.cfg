# setuptools + Babel configuration only; project metadata is in pyproject.toml.

[options]
packages = find:
namespace_packages = ckanext
install_requires =
include_package_data = True

[extract_messages]
# N_ marks msgids declared in Python constants (see ckanext/evntheme/vocab.py).
keywords = translate isPlural N_
add_comments = TRANSLATORS:
output_file = ckanext/evntheme/i18n/ckanext-evntheme.pot
width = 100

[init_catalog]
domain = ckanext-evntheme
input_file = ckanext/evntheme/i18n/ckanext-evntheme.pot
output_dir = ckanext/evntheme/i18n

[update_catalog]
domain = ckanext-evntheme
input_file = ckanext/evntheme/i18n/ckanext-evntheme.pot
output_dir = ckanext/evntheme/i18n
previous = true

[compile_catalog]
domain = ckanext-evntheme
directory = ckanext/evntheme/i18n
statistics = true
