lakehouse_theme-css:
  # No cssrewrite: it raises "Cannot determine url" for this library (see docs/gotchas.md)
  # and the CSS has no relative url() to rewrite.
  output: ckanext-lakehouse_theme/%(version)s-lakehouse_theme.css
  contents:
    - css/lakehouse_theme.css

lakehouse_theme-js:
  filters: rjsmin
  output: ckanext-lakehouse_theme/%(version)s-lakehouse_theme.js
  contents:
    - js/lakehouse_theme.js
  extra:
    preload:
      - base/main
